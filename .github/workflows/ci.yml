name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: Python unit tests for the OCR worker (standard library only, no model)
        run: python3 -m unittest discover -s packages/ocr-openthai/python/tests -t packages/ocr-openthai/python
      - name: Eval runner smoke test (synthetic data, fake providers, no network)
        run: bun run eval --dataset synthetic --no-write

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The release binary, verified against the published checksums. (Running
      # the container image against a mounted checkout fails git's
      # ownership check.)
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${asset}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${asset}\$" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
